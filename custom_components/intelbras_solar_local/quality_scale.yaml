rules:
  # Bronze
  action-setup: done
  appropriate-polling: done
  brands:
    status: todo
    comment: Brand images ship in custom_components/intelbras_solar_local/brand; not submitted to home-assistant/brands.
  common-modules: done
  config-flow: done
  config-flow-test-coverage: done
  dependency-transparency: done
  docs-actions: done
  docs-conditions:
    status: exempt
    comment: The integration does not provide conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: The integration does not provide triggers.
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable:
    status: todo
    comment: Failed polls are logged at debug level; the inverter sleeps every night, so a warning per sunset would be noise.
  parallel-updates: done
  reauthentication-flow:
    status: exempt
    comment: The datalogger's Modbus TCP needs no credentials.
  test-coverage: done

  # Gold
  devices: done
  diagnostics: done
  discovery: done
  discovery-update-info: done
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices:
    status: exempt
    comment: One config entry is one inverter with its datalogger and plant devices.
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default: done
  entity-translations: done
  exception-translations: todo
  icon-translations:
    status: todo
    comment: Static icons are set on the entity descriptions.
  reconfiguration-flow: todo
  repair-issues:
    status: exempt
    comment: Failures surface through entity availability; nothing needs a repair flow.
  stale-devices:
    status: exempt
    comment: Removing the entry removes its three devices.

  # Platinum
  async-dependency: done
  inject-websession: done
  strict-typing: todo
